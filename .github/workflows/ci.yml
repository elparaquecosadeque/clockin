# Pipeline from CODE_STYLE.md, Quality gates.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - name: Restore
        run: dotnet restore
      - name: Build (warnings as errors, banned packages and APIs)
        run: dotnet build --no-restore -p:ContinuousIntegrationBuild=true
      - name: Format
        run: dotnet format --verify-no-changes --no-restore
      - name: Architecture and integration tests (PostgreSQL in Testcontainers)
        run: dotnet test --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Unit tests
        run: npm run test:ci
      - name: Production build (en and es)
        run: npm run build
      - name: End-to-end and accessibility tests
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
