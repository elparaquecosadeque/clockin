# Pipeline from CODE_STYLE.md, Quality gates.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - name: Restore
        run: dotnet restore
      - name: Restore coverage report tool
        run: dotnet tool restore
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check coverage gate tests
        run: node --test ../scripts/coverage-check.test.mjs
      - name: Build (warnings as errors, banned packages and APIs)
        run: dotnet build --no-restore -p:ContinuousIntegrationBuild=true
      - name: Format
        run: dotnet format --verify-no-changes --no-restore
      - name: Tests and coverage (PostgreSQL in Testcontainers)
        run: node ../scripts/coverage.mjs backend
      - name: Coverage summary
        if: always()
        run: |
          if [ -f ../coverage/backend/SummaryGithub.md ]; then
            printf '## Backend coverage\n' >> "$GITHUB_STEP_SUMMARY"
            cat ../coverage/backend/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage/backend/
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - name: Restore coverage report tool
        run: dotnet tool restore
      - name: Format
        run: npm run format:check
      - name: Unit tests and coverage
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f ../coverage/frontend/SummaryGithub.md ]; then
            printf '## Frontend coverage\n' >> "$GITHUB_STEP_SUMMARY"
            cat ../coverage/frontend/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: coverage/frontend/
          if-no-files-found: error
      - name: Production build (en and es)
        run: npm run build
      - name: End-to-end and accessibility tests
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
