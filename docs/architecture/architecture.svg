<text x="720" y="251" font-size="14" text-anchor="middle" fill="#1e1e1e">HTTPS /api · bearer JWT</text>
<text x="720" y="268" font-size="14" text-anchor="middle" fill="#1e1e1e">refresh cookie on /api/auth</text>
<line x1="720" y1="456" x2="720" y2="534" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head)"/>
<line x1="542.6086956521739" y1="456" x2="325.30434782608694" y2="554" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head)"/>
