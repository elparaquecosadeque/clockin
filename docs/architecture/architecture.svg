<line x1="720" y1="676" x2="720" y2="774" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head)"/>
<line x1="1212.608695652174" y1="676" x2="1166.4347826086957" y2="794" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head)" stroke-dasharray="8 6"/>
<line x1="1285.6521739130435" y1="676" x2="1362.608695652174" y2="794" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head)" stroke-dasharray="8 6"/>
<line x1="210" y1="656" x2="210" y2="794" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head)" stroke-dasharray="8 6"/>
<text x="40" y="974" font-size="14" fill="#495057">Solid arrow: project reference (depends on). Dashed: runtime traffic or I/O.</text>
<text x="40" y="992" font-size="14" fill="#495057">Infrastructure and Persistence implement the ports Application declares; Domain depends on nothing of ours.</text>
<text x="40" y="1010" font-size="14" fill="#495057">The engine comes from configuration (Database:Provider); LayerDependencyTests enforces the references.</text>
</svg>
