map $http_x_forwarded_proto $origin_scheme {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_tokens off;
    absolute_redirect off;
    root /usr/share/nginx/html;
    set_real_ip_from 172.30.82.1;
    real_ip_header CF-Connecting-IP;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = / { return 302 /en/$is_args$args; }
    location = /en { return 302 /en/$is_args$args; }
    location = /es { return 302 /es/$is_args$args; }
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
    }
    location /health/ { proxy_pass http://api:8080; }
    location ~* \.(?:js|css|woff2?|png|svg|ico|json)$ { try_files $uri =404; }
    location /en/ { try_files $uri $uri/ /en/index.html; }
    location /es/ { try_files $uri $uri/ /es/index.html; }
    location / { return 302 /en$request_uri; }
}
