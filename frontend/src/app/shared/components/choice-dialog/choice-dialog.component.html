<h2 mat-dialog-title>{{ data.title }}</h2>
<form (submit)="submit($event)">
  <mat-dialog-content>
    @if (data.message) {
      <p>{{ data.message }}</p>
    }
    <mat-form-field>
      <mat-label>{{ data.label }}</mat-label>
      <mat-select [formControl]="choice" required>
        @for (option of data.options; track option.value) {
          <mat-option [value]="option.value">{{ option.label }}</mat-option>
        }
      </mat-select>
      <mat-error i18n="@@chooseOne">Choose one.</mat-error>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close i18n="@@cancel">Cancel</button>
    <button mat-flat-button type="submit">{{ data.confirm }}</button>
  </mat-dialog-actions>
</form>
