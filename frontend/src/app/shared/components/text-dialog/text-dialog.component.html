<h2 mat-dialog-title>{{ data.title }}</h2>
<form (submit)="submit($event)">
  <mat-dialog-content>
    @if (data.message) {
      <p>{{ data.message }}</p>
    }
    @if (data.label) {
      <mat-form-field>
        <mat-label>{{ data.label }}</mat-label>
        <textarea
          matInput
          cdkFocusInitial
          rows="3"
          [formControl]="text"
          [required]="!!data.required"
        ></textarea>
        <mat-hint align="end">{{ text.value.length }} / {{ data.maxLength }}</mat-hint>
        @if (text.hasError('maxlength')) {
          <mat-error i18n="@@textTooLong">Use at most {{ data.maxLength }} characters.</mat-error>
        } @else {
          <mat-error i18n="@@textRequired">Enter some text.</mat-error>
        }
      </mat-form-field>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close i18n="@@cancel">Cancel</button>
    <button mat-flat-button type="submit">{{ data.confirm }}</button>
  </mat-dialog-actions>
</form>
